<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script>
  (() => {
    const brandConfig = {
      luxury: { css: 'brand-01-luxury.css', slug: 'luxury' },
      retail: { css: 'brand-02-retail.css', slug: 'retail' },
      digital: { css: 'brand-15-digital.css', slug: 'digital' },
      travel: { css: 'brand-03-travel.css', slug: 'travel' },
      wellness: { css: 'brand-04-wellness.css', slug: 'wellness' },
      finance: { css: 'brand-05-finance.css', slug: 'finance' },
    };

    const matchBrand = () => {
      const metaBrand = document.querySelector('meta[name="brand"]')?.content;
      if (metaBrand) {
        const key = metaBrand.trim().toLowerCase();
        if (brandConfig[key]) return key;
      }

      const queryBrand = new URLSearchParams(window.location.search).get('brand');
      if (queryBrand) {
        const key = queryBrand.trim().toLowerCase();
        if (brandConfig[key]) return key;
      }

      const firstSegment = window.location.pathname.split('/').filter(Boolean)[0]?.toLowerCase();
      if (firstSegment && brandConfig[firstSegment]) {
        return firstSegment;
      }

      return 'luxury';
    };

    const brandKey = matchBrand();
    document.documentElement.dataset.brand = brandKey;
    document.documentElement.dataset.brandLabel = brandConfig[brandKey].label || brandKey;

    const href = `/styles/${brandConfig[brandKey].css}`;
    if (!document.querySelector(`head > link[href="${href}"]`)) {
      const brandLink = document.createElement('link');
      brandLink.rel = 'stylesheet';
      brandLink.href = href;
      document.head.appendChild(brandLink);
    }
  })();
</script>
<script src="/scripts/aem.js" type="module"></script>
<script src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
